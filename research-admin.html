<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Research Admin — Personal Archive</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@400;500;600&family=Caveat:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0;background:#F5F2EC;color:#353B38;font-family:'Manrope',sans-serif;}
.font-serif{font-family:'Cormorant Garamond',serif;}

/* LOGIN */
#loginBox{max-width:400px;margin:160px auto;background:#FAF8F3;padding:40px;border:1px solid #DDD8CF;text-align:center;}
#loginBox .logo{font-family:'Cormorant Garamond',serif;font-size:30px;color:#3E4741;}
#loginBox .logo-sub{margin-top:3px;margin-bottom:30px;font-size:9px;letter-spacing:.25em;color:#8A8C82;}
#loginBox input{width:100%;padding:12px;border:1px solid #D8D3CA;background:#FFFDF8;font-family:'Manrope',sans-serif;font-size:12px;margin-bottom:15px;outline:none;}
#loginBox button{width:100%;padding:12px;border:none;background:#4D594F;color:white;cursor:pointer;font-size:12px;}
#loginBox button:hover{background:#3D493F;}
#loginMessage{margin-top:12px;font-size:11px;color:#A45D52;}

/* SIDEBAR */
.sidebar{width:250px;position:fixed;top:0;left:0;bottom:0;background:#ECE8DF;border-right:1px solid #D9D3C8;padding:35px 25px;z-index:50;}
.logo{font-family:'Cormorant Garamond',serif;font-size:30px;color:#3E4741;}
.logo-sub{margin-top:3px;font-size:9px;letter-spacing:.25em;color:#8A8C82;}
.nav{margin-top:70px;}
.nav-label{font-size:9px;letter-spacing:.25em;color:#9A978E;margin-bottom:15px;}
.nav-item{display:flex;align-items:center;gap:12px;padding:12px 10px;margin-bottom:4px;font-size:12px;color:#626A63;cursor:pointer;transition:.25s;}
.nav-item:hover{background:#E3DED3;}
.nav-item.active{background:#D9DED4;color:#39433C;}
.nav-icon{width:6px;height:6px;border-radius:50%;background:#9AA694;}
.admin-footer{position:absolute;bottom:30px;left:25px;right:25px;border-top:1px solid #D8D2C7;padding-top:20px;font-size:10px;color:#98968E;}

/* MAIN */
.main{margin-left:250px;min-height:100vh;}
.topbar{height:80px;display:flex;justify-content:space-between;align-items:center;padding:0 45px;border-bottom:1px solid #DDD8CF;background:#F8F6F1;}
.page-title{font-family:'Cormorant Garamond',serif;font-size:28px;}
.status{font-size:10px;letter-spacing:.15em;color:#778174;}
.content{padding:45px;}
.welcome small{font-size:10px;letter-spacing:.25em;color:#8C9087;}
.welcome h1{margin-top:8px;font-family:'Cormorant Garamond',serif;font-size:42px;font-weight:500;}

/* FORM SECTION */
.form-section{background:#FAF8F3;border:1px solid #DDD8CF;padding:35px;margin-top:35px;}
.section-title{font-family:'Cormorant Garamond',serif;font-size:26px;margin-bottom:5px;color:#3E4741;}
.section-sub{font-size:11px;color:#96978F;margin-bottom:25px;}
.form-group{margin-bottom:20px;}
.form-label{display:block;font-size:10px;letter-spacing:.12em;color:#858980;margin-bottom:8px;}
input,textarea{width:100%;padding:12px;border:1px solid #D8D3CA;background:#FFFDF8;font-family:'Manrope',sans-serif;font-size:12px;color:#353B38;outline:none;transition:.2s;}
input:focus,textarea:focus{border-color:#9AA394;box-shadow:0 0 0 2px rgba(154,163,148,.12);}
textarea{min-height:100px;resize:vertical;}
.preview{width:180px;margin-top:12px;display:none;border:1px solid #DDD8CF;}
.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:25px;padding-top:20px;border-top:1px solid #DDD8CF;}
.cancel{padding:12px 20px;border:1px solid #D5D0C7;background:none;cursor:pointer;font-size:12px;}
.cancel:hover{background:#EFEBE3;}
.save{padding:12px 25px;border:none;background:#4D594F;color:white;cursor:pointer;font-size:12px;}
.save:hover{background:#3D493F;}
#message{margin-top:15px;font-size:12px;font-weight:600;}

/* PROJECT LIST */
.project-list{background:#FAF8F3;border:1px solid #DDD8CF;overflow:hidden;margin-top:35px;}
.project-row{display:grid;grid-template-columns:90px minmax(180px,2fr) 1fr 100px;align-items:center;padding:16px 20px;border-bottom:1px solid #E5E1D9;transition:.2s;}
.project-row:last-child{border-bottom:none;}
.project-row:hover{background:#F5F2EB;}
.thumb{width:65px;height:45px;object-fit:cover;background:#E8E3D9;display:block;}
.project-title{font-family:'Cormorant Garamond',serif;font-size:20px;}
.project-meta{font-size:10px;color:#96978F;margin-top:3px;}
.actions{display:flex;gap:12px;}
.action{font-size:10px;cursor:pointer;color:#7E837C;transition:.2s;}
.action:hover{color:#3E4741;}
.action.delete:hover{color:#A45D52;}
.empty-state,.loading-state{padding:50px 30px;text-align:center;color:#92948B;font-size:12px;}

@media(max-width:850px){
    .sidebar{width:70px;padding:25px 10px;}
    .logo{font-size:20px;text-align:center;}
    .logo-sub,.nav-label,.nav-item span,.admin-footer{display:none;}
    .nav-item{justify-content:center;}
    .main{margin-left:70px;}
    .topbar{padding:0 20px;}
    .content{padding:25px 20px;}
    .project-row{grid-template-columns:65px 1fr;gap:12px;}
    .project-row > *:nth-child(n+3){display:none;}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox">
    <div class="logo">Yuri</div>
    <div class="logo-sub">RESEARCH ADMIN LOGIN</div>
    <input type="password" id="adminPassword" placeholder="Password">
    <button id="adminLoginButton">Login</button>
    <p id="loginMessage"></p>
</div>

<!-- ADMIN APP -->
<div id="adminApp" style="display:none;">

<aside class="sidebar">
    <div class="logo">Yuri</div>
    <div class="logo-sub">PERSONAL ARCHIVE</div>
    <nav class="nav">
        <div class="nav-label">CONTENT</div>
        <div class="nav-item active"><div class="nav-icon"></div><span>Research Projects</span></div>
    </nav>
    <div class="admin-footer">Research Admin · 2026</div>
</aside>

<main class="main">

<header class="topbar">
    <div class="page-title">Research Admin</div>
    <div class="status">● SYSTEM ONLINE</div>
</header>

<div class="content">

<div class="welcome">
    <small>PERSONAL ARCHIVE / RESEARCH MANAGEMENT</small>
    <h1>Research Upload</h1>
</div>

<!-- FORM -->
<div class="form-section">

    <div class="section-title">Project Information</div>
    <div class="section-sub">새 프로젝트를 추가하거나 기존 프로젝트를 수정하세요.</div>

    <div class="form-group">
        <label class="form-label">TITLE</label>
        <input id="title">
    </div>

    <div class="form-group">
        <label class="form-label">TYPE</label>
        <input id="type">
    </div>

    <div class="form-group">
        <label class="form-label">IMAGE PATH</label>
        <input id="image" placeholder="example: scheme.png">
        <img id="image-preview" class="preview">
    </div>

    <div class="form-group">
        <label class="form-label">OVERVIEW</label>
        <textarea id="overview"></textarea>
    </div>

    <div class="form-group">
        <label class="form-label">RESEARCH STRATEGY</label>
        <textarea id="strategy"></textarea>
    </div>

    <div class="form-group">
        <label class="form-label">RESEARCH HIGHLIGHT</label>
        <textarea id="highlight"></textarea>
    </div>

    <div class="form-group">
        <label class="form-label">PUBLICATION</label>
        <textarea id="publication"></textarea>
    </div>

    <div class="form-group">
        <label class="form-label">TAGS (comma separated)</label>
        <input id="tags" placeholder="Cancer Metabolism, Nanomedicine">
    </div>

    <div class="form-group">
        <label class="form-label">RESULT IMAGES (use |)</label>
        <input id="resultsImages" placeholder="img1.png|img2.png|img3.png">
    </div>

    <div class="form-group">
        <label class="form-label">RESULT TITLES (use |)</label>
        <input id="resultsTitles" placeholder="Title1|Title2|Title3">
    </div>

    <div class="form-group">
        <label class="form-label">RESULT CAPTIONS (use |)</label>
        <textarea id="resultsCaptions"></textarea>
    </div>

    <div class="form-actions">
        <button class="cancel" id="cancelEdit">Cancel</button>
        <button class="save" id="save">Save Project</button>
    </div>

    <p id="message"></p>

</div>

<!-- PROJECT LIST -->
<div class="project-list">
    <div id="project-list">
        <div class="loading-state">LOADING PROJECTS...</div>
    </div>
</div>

</div>
</main>

</div>

<!-- FIREBASE -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyD_d4etBdBcvBRhTJlD3cLssN309LAdlfg",
    authDomain: "yuri-research-portfolio.firebaseapp.com",
    projectId: "yuri-research-portfolio",
    storageBucket: "yuri-research-portfolio.firebasestorage.app",
    messagingSenderId: "231317507996",
    appId: "1:231317507996:web:9773282c138706d886c259",
    measurementId: "G-57VHW2454E"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let currentEditId = null;

const saveButton = document.getElementById("save");
const cancelEdit = document.getElementById("cancelEdit");
const message = document.getElementById("message");
const imageInput = document.getElementById("image");
const imagePreview = document.getElementById("image-preview");
const projectList = document.getElementById("project-list");

imageInput.addEventListener("input", () => {
    const value = imageInput.value.trim();
    if (value) {
        imagePreview.src = value;
        imagePreview.style.display = "block";
    } else {
        imagePreview.style.display = "none";
    }
});

cancelEdit.addEventListener("click", () => {
    clearForm();
});

saveButton.addEventListener("click", async () => {

    const data = {
        title: document.getElementById("title").value.trim(),
        type: document.getElementById("type").value.trim(),
        image: document.getElementById("image").value.trim(),
        overview: document.getElementById("overview").value.trim(),
        strategy: document.getElementById("strategy").value.trim(),
        highlight: document.getElementById("highlight").value.trim(),
        publication: document.getElementById("publication").value.trim(),
        tags: document.getElementById("tags").value.split(",").map(t => t.trim()).filter(t => t),
        resultsImages: document.getElementById("resultsImages").value.split("|").map(t => t.trim()).filter(t => t),
        resultsTitles: document.getElementById("resultsTitles").value.split("|").map(t => t.trim()).filter(t => t),
        resultsCaptions: document.getElementById("resultsCaptions").value.split("|").map(t => t.trim()).filter(t => t)
    };

    try {

        if (currentEditId) {
            await updateDoc(doc(db, "projects", currentEditId), data);
            message.textContent = "✅ Project updated successfully.";
            message.style.color = "#4D594F";
        } else {
            await addDoc(collection(db, "projects"), data);
            message.textContent = "✅ Project uploaded successfully.";
            message.style.color = "#4D594F";
        }

        currentEditId = null;
        clearForm();
        await loadProjects();

    } catch (error) {
        console.error("Firebase Error:", error);
        message.textContent = "❌ Error: " + error.message;
        message.style.color = "#A45D52";
    }

});

async function loadProjects() {

    projectList.innerHTML = `<div class="loading-state">LOADING PROJECTS...</div>`;

    try {

        const snapshot = await getDocs(collection(db, "projects"));

        if (snapshot.empty) {
            projectList.innerHTML = `<div class="empty-state">No projects yet.</div>`;
            return;
        }

        projectList.innerHTML = "";

        snapshot.forEach((item) => {

            const data = item.data();

            const row = document.createElement("div");
            row.className = "project-row";

            row.innerHTML = `
                <div>
                    ${data.image ? `<img class="thumb" src="${data.image}" onerror="this.style.display='none';">` : `<div class="thumb"></div>`}
                </div>
                <div>
                    <div class="project-title">${data.title || "Untitled"}</div>
                    <div class="project-meta">${data.type || ""} · ${(data.tags || []).join(", ")}</div>
                </div>
                <div class="project-meta"></div>
                <div class="actions">
                    <span class="action edit-action">EDIT</span>
                    <span class="action delete delete-action">DELETE</span>
                </div>
            `;

            row.querySelector(".edit-action").addEventListener("click", () => {

                currentEditId = item.id;

                document.getElementById("title").value = data.title || "";
                document.getElementById("type").value = data.type || "";
                document.getElementById("image").value = data.image || "";
                document.getElementById("overview").value = data.overview || "";
                document.getElementById("strategy").value = data.strategy || "";
                document.getElementById("highlight").value = data.highlight || "";
                document.getElementById("publication").value = data.publication || "";
                document.getElementById("tags").value = (data.tags || []).join(", ");
                document.getElementById("resultsImages").value = (data.resultsImages || []).join("|");
                document.getElementById("resultsTitles").value = (data.resultsTitles || []).join("|");
                document.getElementById("resultsCaptions").value = (data.resultsCaptions || []).join("|");

                if (data.image) {
                    imagePreview.src = data.image;
                    imagePreview.style.display = "block";
                } else {
                    imagePreview.style.display = "none";
                }

                saveButton.textContent = "Update Project";

                window.scrollTo({ top: 0, behavior: "smooth" });

            });

            row.querySelector(".delete-action").addEventListener("click", async () => {

                const check = confirm("Are you sure you want to delete this project?");
                if (!check) return;

                try {
                    await deleteDoc(doc(db, "projects", item.id));
                    message.textContent = "🗑 Project deleted successfully.";
                    message.style.color = "#4D594F";
                    await loadProjects();
                } catch (error) {
                    console.error(error);
                    message.textContent = "❌ Delete failed: " + error.message;
                    message.style.color = "#A45D52";
                }

            });

            projectList.appendChild(row);

        });

    } catch (error) {
        console.error(error);
        projectList.innerHTML = `<div class="empty-state">❌ Failed to load projects.</div>`;
    }

}

function clearForm() {
    document.querySelectorAll("#adminApp input, #adminApp textarea").forEach(el => el.value = "");
    imagePreview.style.display = "none";
    saveButton.textContent = "Save Project";
    currentEditId = null;
}

window.loadProjectsOnLogin = loadProjects;

</script>

<!-- LOGIN LOGIC -->
<script>
const ADMIN_PASSWORD = "ulily36";

const loginBox = document.getElementById("loginBox");
const adminApp = document.getElementById("adminApp");
const loginButton = document.getElementById("adminLoginButton");
const passwordInput = document.getElementById("adminPassword");
const loginMessage = document.getElementById("loginMessage");

function tryLogin(){
    if(passwordInput.value.trim() === ADMIN_PASSWORD){
        loginBox.style.display = "none";
        adminApp.style.display = "block";
        if (window.loadProjectsOnLogin) {
            window.loadProjectsOnLogin();
        }
    } else {
        loginMessage.textContent = "Wrong password.";
        passwordInput.value = "";
    }
}

loginButton.addEventListener("click", tryLogin);
passwordInput.addEventListener("keydown", (e) => {
    if(e.key === "Enter") tryLogin();
});
</script>

</body>
</html>
