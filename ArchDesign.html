<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lily Gloges — Florist Atelier</title>

<!-- =========================================================
     GOOGLE FONT
========================================================= -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
  href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap"
  rel="stylesheet"
>


<style>

/* =========================================================
   01. RESET
========================================================= */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {

  min-width: 320px;

  overflow-x: hidden;

  background: #DED7C8;

  color: #6F6759;

  font-family:
    "Cormorant Garamond",
    Georgia,
    "Times New Roman",
    serif;

}


/* =========================================================
   02. HERO OUTER

   종이 뒤에 깔리는 전체 영역

   사진이 화면 전체에 깔리고
   그 위에 큰 종이 페이지가 올라감
========================================================= */

.hero-section {

  position: relative;

  width: 100%;

  min-height: 1050px;

  padding:
    70px
    7vw
    120px;

  display: flex;

  justify-content: center;

  align-items: center;

  overflow: hidden;

}


/* =========================================================
   03. BACKGROUND IMAGE

   아치 사진과 동일한 사진을
   뒤쪽 전체에 크게 깔아줌
========================================================= */

.hero-background {

  position: absolute;

  inset: -60px;

  z-index: 0;

  overflow: hidden;

}


.hero-background img {

  width: 100%;

  height: 100%;

  object-fit: cover;

  object-position: center;

  transform: scale(1.12);

  filter:
    blur(5px)
    saturate(0.45)
    brightness(1.15);

}


/* =========================================================
   04. BACKGROUND SOFT VEIL

   배경을 뽀얗고 종이처럼
   불투명하게 만들어줌
========================================================= */

.hero-background::after {

  content: "";

  position: absolute;

  inset: 0;

  background:

    linear-gradient(
      rgba(244, 239, 226, 0.78),
      rgba(238, 232, 216, 0.84)
    );

}


/* =========================================================
   05. MAIN PAPER

   Film 디자인처럼
   충분히 크고 넓은 종이 페이지

   중앙의 아치와 텍스트가
   이 안에 들어감
========================================================= */

.hero-paper {

  position: relative;

  z-index: 5;

  width: min(900px, 88vw);

  min-height: 900px;

  padding:
    90px
    80px
    100px;

  background: #F4EFE2;

  border-radius: 5px;

  box-shadow:

    0 35px 90px
    rgba(73, 61, 45, 0.20),

    0 8px 25px
    rgba(73, 61, 45, 0.10);

}


/* =========================================================
   06. PAPER TEXTURE

   아주 약한 종이 질감
========================================================= */

.hero-paper::before {

  content: "";

  position: absolute;

  inset: 0;

  pointer-events: none;

  opacity: 0.42;

  background-image:

    radial-gradient(
      rgba(112, 96, 72, 0.055) 0.7px,
      transparent 0.7px
    );

  background-size: 7px 7px;

}


/* =========================================================
   07. PAPER INNER

   실제 콘텐츠 레이어
========================================================= */

.hero-paper-inner {

  position: relative;

  z-index: 2;

  width: 100%;

  height: 100%;

  display: flex;

  flex-direction: column;

  align-items: center;

}


/* =========================================================
   08. SMALL DECORATIVE SYMBOL

   상단 중앙 작은 장식
========================================================= */

.hero-symbol {

  font-family: Georgia, serif;

  font-size: 24px;

  line-height: 1;

  color: #8A806D;

  opacity: 0.62;

  margin-bottom: 8px;

}


/* =========================================================
   09. CIRCULAR TITLE

   핵심 디자인

   아치 사진 위쪽에 붙어있는
   둥근 곡선형 타이틀

   이전보다 아치에 훨씬 가까움
========================================================= */

.hero-circle-title {

  position: relative;

  z-index: 5;

  width: min(520px, 72%);

  height: 145px;

  margin-bottom: -68px;

  overflow: visible;

}


/* SVG */

.hero-circle-title svg {

  width: 100%;

  height: 100%;

  overflow: visible;

}


/* 둥근 글씨 */

.hero-circle-title text {

  font-family:
    "Cormorant Garamond",
    Georgia,
    serif;

  font-size: 27px;

  font-weight: 400;

  letter-spacing: 0.075em;

  fill: #817562;

}


/* =========================================================
   10. ARCH PHOTO

   중앙의 메인 사진

   길고 세로로 내려오는
   큰 아치 형태
========================================================= */

.hero-arch {

  position: relative;

  z-index: 3;

  width: min(430px, 58%);

  aspect-ratio: 0.68;

  overflow: hidden;

  background: #D8D0BE;

  border-radius:

    220px
    220px
    0
    0;

  box-shadow:

    0 12px 30px
    rgba(79, 67, 49, 0.10);

}


/* =========================================================
   11. ARCH IMAGE
========================================================= */

.hero-arch img {

  width: 100%;

  height: 100%;

  object-fit: cover;

  object-position: center;

  filter:

    saturate(0.68)
    brightness(1.04)
    contrast(0.94);

  transition:
    transform 1s ease;

}


.hero-arch:hover img {

  transform: scale(1.035);

}


/* =========================================================
   12. NAME

   아치 아래 작은 타이틀
========================================================= */

.hero-name {

  margin-top: 28px;

  font-family:
    "Cormorant Garamond",
    Georgia,
    serif;

  font-size: 17px;

  font-weight: 400;

  letter-spacing: 0.32em;

  color: #817766;

  text-align: center;

}


/* =========================================================
   13. DESCRIPTION

   아치 아래 설명
========================================================= */

.hero-description {

  max-width: 400px;

  margin-top: 24px;

  text-align: center;

  font-family:
    "Cormorant Garamond",
    Georgia,
    serif;

  font-size: 15px;

  font-weight: 400;

  line-height: 1.85;

  letter-spacing: 0.025em;

  color: #817766;

}


/* =========================================================
   14. PAPER BOTTOM HANDLE

   종이 내부 가장 아래
========================================================= */

.hero-handle {

  position: absolute;

  bottom: 38px;

  left: 0;

  width: 100%;

  text-align: center;

  font-family:
    "Cormorant Garamond",
    Georgia,
    serif;

  font-size: 11px;

  letter-spacing: 0.12em;

  color: #978B76;

}


/* =========================================================
   15. OUTER BOTTOM CAPTION

   종이 바깥쪽 아래

   Film 디자인처럼
   종이에서 살짝 떨어져 보이게 배치
========================================================= */

.hero-bottom-caption {

  position: absolute;

  z-index: 8;

  left: 50%;

  bottom: 42px;

  transform: translateX(-50%);

  display: flex;

  align-items: center;

  justify-content: center;

  gap: 16px;

  white-space: nowrap;

  color: #746C5D;

  font-family:
    "Cormorant Garamond",
    Georgia,
    serif;

  font-size: 14px;

  font-style: italic;

  letter-spacing: 0.03em;

}


/* 양쪽 선 */

.caption-line {

  width: 75px;

  height: 1px;

  background:
    rgba(116, 108, 93, 0.55);

}


/* =========================================================
   16. TABLET
========================================================= */

@media (max-width: 900px) {

  .hero-section {

    min-height: 950px;

    padding:
      55px
      30px
      110px;

  }


  .hero-paper {

    width: min(760px, 90vw);

    min-height: 850px;

    padding:
      75px
      60px
      90px;

  }


  .hero-circle-title {

    width: 70%;

    height: 130px;

    margin-bottom: -60px;

  }


  .hero-circle-title text {

    font-size: 24px;

  }


  .hero-arch {

    width: 54%;

    max-width: 380px;

  }


  .hero-bottom-caption {

    bottom: 38px;

  }

}


/* =========================================================
   17. MOBILE
========================================================= */

@media (max-width: 640px) {

  .hero-section {

    min-height: 850px;

    padding:
      35px
      18px
      90px;

  }


  .hero-paper {

    width: 92vw;

    min-height: 760px;

    padding:
      55px
      25px
      70px;

  }


  .hero-symbol {

    font-size: 19px;

    margin-bottom: 4px;

  }


  .hero-circle-title {

    width: 100%;

    height: 120px;

    margin-bottom: -54px;

  }


  .hero-circle-title text {

    font-size: 21px;

    letter-spacing: 0.055em;

  }


  .hero-arch {

    width: 66%;

    max-width: 290px;

  }


  .hero-name {

    margin-top: 20px;

    font-size: 13px;

    letter-spacing: 0.25em;

  }


  .hero-description {

    max-width: 260px;

    margin-top: 18px;

    font-size: 12px;

    line-height: 1.75;

  }


  .hero-handle {

    bottom: 25px;

    font-size: 9px;

  }


  .hero-bottom-caption {

    bottom: 23px;

    gap: 9px;

    font-size: 11px;

  }


  .caption-line {

    width: 35px;

  }

}


/* =========================================================
   18. SMALL MOBILE
========================================================= */

@media (max-width: 420px) {

  .hero-section {

    min-height: 790px;

  }


  .hero-paper {

    min-height: 700px;

    padding:
      48px
      20px
      65px;

  }


  .hero-circle-title {

    height: 105px;

    margin-bottom: -48px;

  }


  .hero-circle-title text {

    font-size: 18px;

  }


  .hero-arch {

    width: 68%;

  }


  .hero-name {

    font-size: 12px;

  }


  .hero-description {

    font-size: 11px;

  }

}

</style>

</head>


<body>


<!-- =========================================================
     HERO ONLY
========================================================= -->

<header class="hero-section">


  <!-- =======================================================
       BACKGROUND

       아치 사진과 같은 사진을
       페이지 전체 뒤에 흐릿하게 배치
  ======================================================== -->

  <div class="hero-background">

    <img
      src="https://images.unsplash.com/photo-1526047932273-341f2a7631f9?auto=format&fit=crop&w=1800&q=90"
      alt=""
    >

  </div>


  <!-- =======================================================
       MAIN PAPER
  ======================================================== -->

  <div class="hero-paper">


    <div class="hero-paper-inner">


      <!-- ===================================================
           SMALL SYMBOL
      ==================================================== -->

      <div class="hero-symbol">
        ✳
      </div>


      <!-- ===================================================
           CURVED TITLE

           아치 사진과 최대한 가까운 위치
      ==================================================== -->

      <div class="hero-circle-title">

        <svg
          viewBox="0 0 500 250"
          aria-hidden="true"
        >

          <defs>

            <path
              id="hero-title-arc"
              d="
                M 45 220
                A 205 205 0 0 1 455 220
              "
            />

          </defs>


          <text>

            <textPath
              href="#hero-title-arc"
              startOffset="50%"
              text-anchor="middle"
            >
              LILY GLOGES · FLORIST ATELIER ·
            </textPath>

          </text>

        </svg>

      </div>


      <!-- ===================================================
           MAIN ARCH PHOTO
      ==================================================== -->

      <div class="hero-arch">

        <img
          src="https://images.unsplash.com/photo-1526047932273-341f2a7631f9?auto=format&fit=crop&w=1000&q=90"
          alt="Lily Gloges Florist"
        >

      </div>


      <!-- ===================================================
           NAME
      ==================================================== -->

      <div class="hero-name">

        LILY GLOGES

      </div>


      <!-- ===================================================
           DESCRIPTION
      ==================================================== -->

      <p class="hero-description">

        A quiet space where flowers,
        <br>

        light and everyday moments
        <br>

        become something to remember.

      </p>


      <!-- ===================================================
           HANDLE
      ==================================================== -->

      <div class="hero-handle">

        @lilygloges

      </div>


    </div>

  </div>


  <!-- =======================================================
       OUTER BOTTOM CAPTION

       종이 아래 바깥쪽에 위치
  ======================================================== -->

  <div class="hero-bottom-caption">

    <span class="caption-line"></span>

    <span>
      a little story about flowers
    </span>

    <span class="caption-line"></span>

  </div>


</header>


</body>
</html>
