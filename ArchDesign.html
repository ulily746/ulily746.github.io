<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lily Gloges — Florist Atelier</title>

<!-- =========================================================
     GOOGLE FONT
========================================================= -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
  href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap"
  rel="stylesheet"
>


<style>

/* =========================================================
   RESET
========================================================= */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {

  min-width: 320px;

  margin: 0;

  overflow-x: hidden;

  background: #D9D0BD;

  color: #7C715F;

  font-family:
    "Cormorant Garamond",
    Georgia,
    "Times New Roman",
    serif;

}


/* =========================================================
   HERO OUTER
   화면 전체
========================================================= */

.hero-section {

  position: relative;

  width: 100%;

  min-height: 1100px;

  display: flex;

  justify-content: center;

  align-items: center;

  padding:
    55px
    3.5vw
    80px;

  overflow: hidden;

  background: #DDD4C3;

}


/* =========================================================
   BACKGROUND IMAGE
   종이 뒤에 크게 깔리는 동일한 사진
========================================================= */

.hero-background {

  position: absolute;

  inset: -50px;

  z-index: 0;

  overflow: hidden;

}


.hero-background img {

  width: 100%;

  height: 100%;

  object-fit: cover;

  object-position: center;

  transform: scale(1.08);

  filter:

    blur(3px)

    saturate(0.48)

    brightness(1.08)

    contrast(0.92);

}


/* =========================================================
   BACKGROUND SOFT PAPER VEIL

   사진 위에 크림색을 덮어서
   불투명하고 빈티지한 느낌
========================================================= */

.hero-background-overlay {

  position: absolute;

  inset: 0;

  z-index: 1;

  background:

    linear-gradient(
      rgba(244, 239, 225, 0.78),
      rgba(235, 228, 211, 0.84)
    );

}


/* =========================================================
   MAIN PAPER
   화면 양옆 여백을 최소화한 큰 종이
========================================================= */

.hero-paper {

  position: relative;

  z-index: 5;

  width: min(
    1360px,
    calc(100vw - 7vw)
  );

  min-height: 970px;

  padding:

    95px

    clamp(50px, 8vw, 150px)

    100px;

  background:

    rgba(248, 244, 233, 0.97);

  border-radius: 8px;

  box-shadow:

    0 30px 90px
    rgba(74, 62, 45, 0.17),

    0 5px 18px
    rgba(74, 62, 45, 0.08);

  overflow: hidden;

}


/* =========================================================
   PAPER TEXTURE
========================================================= */

.hero-paper::before {

  content: "";

  position: absolute;

  inset: 0;

  z-index: 0;

  pointer-events: none;

  opacity: 0.42;

  background-image:

    radial-gradient(
      rgba(116, 101, 76, 0.07) 0.7px,
      transparent 0.7px
    );

  background-size: 7px 7px;

}


/* =========================================================
   PAPER INNER CONTENT
========================================================= */

.hero-paper-inner {

  position: relative;

  z-index: 2;

  width: 100%;

  max-width: 1080px;

  margin: 0 auto;

  text-align: center;

}


/* =========================================================
   SMALL TOP DECORATION
========================================================= */

.hero-star {

  position: relative;

  z-index: 5;

  margin-bottom: 5px;

  font-family:
    Georgia,
    serif;

  font-size: 28px;

  line-height: 1;

  color: #938671;

  opacity: 0.65;

}


/* =========================================================
   CIRCULAR TITLE AREA

   아치 사진을 감싸는 큰 원형 문구
========================================================= */

.hero-circle-title {

  position: relative;

  z-index: 5;

  width: 100%;

  height: 235px;

  margin: 0 auto -105px;

  overflow: visible;

}


/* =========================================================
   SVG
========================================================= */

.hero-circle-title svg {

  display: block;

  width: 100%;

  height: 100%;

  overflow: visible;

}


/* =========================================================
   CIRCULAR TEXT
========================================================= */

.hero-circle-title text {

  font-family:

    "Cormorant Garamond",

    Georgia,

    serif;

  font-size: 42px;

  font-weight: 400;

  letter-spacing: 0.075em;

  fill: #827663;

}


/* =========================================================
   ARCH PHOTO

   크게 확대
   원형 글자가 아치 상단을 감싸도록
========================================================= */

.hero-arch {

  position: relative;

  z-index: 3;

  width: min(
    500px,
    52vw
  );

  aspect-ratio: 0.68;

  margin: 0 auto;

  overflow: hidden;

  background: #D7CDB9;

  border-radius:

    260px

    260px

    0

    0;

  box-shadow:

    0 5px 18px
    rgba(90, 76, 56, 0.08);

}


/* =========================================================
   ARCH IMAGE
========================================================= */

.hero-arch img {

  width: 100%;

  height: 100%;

  display: block;

  object-fit: cover;

  object-position: center;

  filter:

    saturate(0.72)

    brightness(1.03)

    contrast(0.94);

  transition:

    transform 1s ease;

}


.hero-arch:hover img {

  transform: scale(1.025);

}


/* =========================================================
   NAME
========================================================= */

.hero-name {

  position: relative;

  z-index: 5;

  margin-top: 32px;

  text-align: center;

  font-family:

    "Cormorant Garamond",

    Georgia,

    serif;

  font-size: 21px;

  font-weight: 400;

  letter-spacing: 0.34em;

  color: #847866;

}


/* =========================================================
   DESCRIPTION
========================================================= */

.hero-description {

  position: relative;

  z-index: 5;

  width: min(
    430px,
    90%
  );

  margin:

    28px

    auto

    0;

  text-align: center;

  font-family:

    "Cormorant Garamond",

    Georgia,

    serif;

  font-size: 17px;

  font-weight: 400;

  line-height: 1.8;

  letter-spacing: 0.035em;

  color: #817766;

}


/* =========================================================
   BOTTOM HANDLE
========================================================= */

.hero-handle {

  position: absolute;

  z-index: 5;

  left: 0;

  bottom: 38px;

  width: 100%;

  text-align: center;

  font-family:

    "Cormorant Garamond",

    Georgia,

    serif;

  font-size: 13px;

  letter-spacing: 0.13em;

  color: #958873;

}


/* =========================================================
   BOTTOM OUTSIDE CAPTION
   종이 바깥 배경 위
========================================================= */

.hero-bottom-caption {

  position: absolute;

  z-index: 8;

  left: 50%;

  bottom: 28px;

  transform:
    translateX(-50%);

  display: flex;

  align-items: center;

  gap: 18px;

  white-space: nowrap;

  font-family:

    "Cormorant Garamond",

    Georgia,

    serif;

  font-size: 15px;

  font-style: italic;

  letter-spacing: 0.03em;

  color: #F6F1E5;

  opacity: 0.92;

}


.caption-line {

  display: block;

  width: 85px;

  height: 1px;

  background:

    rgba(
      246,
      241,
      229,
      0.85
    );

}


/* =========================================================
   LARGE TABLET
========================================================= */

@media (max-width: 1100px) {

  .hero-section {

    min-height: 1000px;

    padding:

      45px

      3vw

      80px;

  }


  .hero-paper {

    width: 94vw;

    min-height: 900px;

    padding:

      75px

      7vw

      90px;

  }


  .hero-circle-title {

    height: 215px;

    margin-bottom: -95px;

  }


  .hero-circle-title text {

    font-size: 37px;

  }


  .hero-arch {

    width: min(
      460px,
      52vw
    );

  }

}


/* =========================================================
   TABLET
========================================================= */

@media (max-width: 768px) {

  .hero-section {

    min-height: 900px;

    padding:

      35px

      2.5vw

      70px;

  }


  .hero-paper {

    width: 95vw;

    min-height: 820px;

    padding:

      65px

      6vw

      80px;

  }


  .hero-star {

    font-size: 23px;

  }


  .hero-circle-title {

    height: 190px;

    margin-bottom: -80px;

  }


  .hero-circle-title text {

    font-size: 32px;

    letter-spacing: 0.06em;

  }


  .hero-arch {

    width: min(
      410px,
      58vw
    );

  }


  .hero-name {

    font-size: 18px;

    margin-top: 27px;

  }


  .hero-description {

    font-size: 15px;

    margin-top: 23px;

  }


  .hero-bottom-caption {

    font-size: 13px;

    gap: 12px;

  }


  .caption-line {

    width: 60px;

  }

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 560px) {

  .hero-section {

    min-height: 790px;

    padding:

      25px

      12px

      65px;

  }


  .hero-paper {

    width: 96vw;

    min-height: 720px;

    padding:

      50px

      20px

      70px;

    border-radius: 6px;

  }


  .hero-star {

    font-size: 19px;

    margin-bottom: 0;

  }


  .hero-circle-title {

    height: 155px;

    margin-bottom: -65px;

  }


  .hero-circle-title text {

    font-size: 25px;

    letter-spacing: 0.045em;

  }


  .hero-arch {

    width: min(
      330px,
      68vw
    );

    border-radius:

      180px

      180px

      0

      0;

  }


  .hero-name {

    margin-top: 22px;

    font-size: 15px;

    letter-spacing: 0.25em;

  }


  .hero-description {

    width: 90%;

    margin-top: 18px;

    font-size: 13px;

    line-height: 1.75;

  }


  .hero-handle {

    bottom: 25px;

    font-size: 10px;

  }


  .hero-bottom-caption {

    bottom: 20px;

    font-size: 11px;

    gap: 8px;

  }


  .caption-line {

    width: 32px;

  }

}


/* =========================================================
   SMALL MOBILE
========================================================= */

@media (max-width: 380px) {

  .hero-section {

    min-height: 730px;

  }


  .hero-paper {

    min-height: 665px;

    padding-top: 42px;

  }


  .hero-circle-title {

    height: 140px;

    margin-bottom: -58px;

  }


  .hero-circle-title text {

    font-size: 22px;

  }


  .hero-arch {

    width: 70vw;

  }


  .hero-name {

    font-size: 13px;

  }


  .hero-description {

    font-size: 12px;

  }

}

</style>

</head>


<body>


<!-- =========================================================
     HERO ONLY
========================================================= -->

<header class="hero-section">


  <!-- =======================================================
       BACKGROUND
  ======================================================== -->

  <div class="hero-background">

    <img
      src="https://images.unsplash.com/photo-1526047932273-341f2a7631f9?auto=format&fit=crop&w=2000&q=90"
      alt=""
    >

  </div>


  <!-- =======================================================
       BACKGROUND OVERLAY
  ======================================================== -->

  <div class="hero-background-overlay"></div>


  <!-- =======================================================
       LARGE PAPER
  ======================================================== -->

  <div class="hero-paper">


    <div class="hero-paper-inner">


      <!-- =====================================================
           DECORATIVE STAR
      ====================================================== -->

      <div class="hero-star">
        ✳
      </div>


      <!-- =====================================================
           CIRCULAR TITLE

           아치 위를 크게 감싸는 글자
      ====================================================== -->

      <div class="hero-circle-title">

        <svg
          viewBox="0 0 800 360"
          preserveAspectRatio="xMidYMid meet"
          aria-hidden="true"
        >

          <defs>

            <path
              id="hero-title-arc"
              d="
                M 100 315
                A 300 300 0 0 1 700 315
              "
            />

          </defs>


          <text>

            <textPath
              href="#hero-title-arc"
              startOffset="50%"
              text-anchor="middle"
            >

              LILY GLOGES · FLORIST ATELIER ·

            </textPath>

          </text>

        </svg>

      </div>


      <!-- =====================================================
           ARCH PHOTO
      ====================================================== -->

      <div class="hero-arch">

        <img
          src="https://images.unsplash.com/photo-1526047932273-341f2a7631f9?auto=format&fit=crop&w=1200&q=90"
          alt="Lily Gloges Florist Atelier"
        >

      </div>


      <!-- =====================================================
           NAME
      ====================================================== -->

      <div class="hero-name">

        LILY GLOGES

      </div>


      <!-- =====================================================
           DESCRIPTION
      ====================================================== -->

      <p class="hero-description">

        A quiet space where flowers,
        <br>

        light and everyday moments
        <br>

        become something to remember.

      </p>


    </div>


    <!-- =====================================================
         HANDLE
    ====================================================== -->

    <div class="hero-handle">

      @lilygloges

    </div>


  </div>


  <!-- =======================================================
       OUTER BOTTOM CAPTION
  ======================================================== -->

  <div class="hero-bottom-caption">

    <span class="caption-line"></span>

    <span>
      a little story about flowers
    </span>

    <span class="caption-line"></span>

  </div>


</header>


</body>

</html>
