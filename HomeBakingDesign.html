<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
    getFirestore,
    doc,
    getDoc
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


/* =========================================================
   FIREBASE CONFIG
========================================================= */

const firebaseConfig = {
    apiKey: "AIzaSyD_d4etBdBcvBRhTJlD3cLssN309LAdlfg",
    authDomain: "yuri-research-portfolio.firebaseapp.com",
    projectId: "yuri-research-portfolio",
    storageBucket: "yuri-research-portfolio.firebasestorage.app",
    messagingSenderId: "231317507996",
    appId: "1:231317507996:web:9773282c138706d886c259",
    measurementId: "G-57VHW2454"
};


const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const params = new URLSearchParams(window.location.search);
const newsId = params.get("id");

function getElement(id){
    return document.getElementById(id);
}

function setText(id, value){
    const element = getElement(id);
    if(!element) return;
    if(value === undefined || value === null) return;
    element.textContent = String(value);
}

function setImage(id, value){
    const element = getElement(id);
    if(!element || !value) return;
    const imageUrl = String(value).trim();
    if(!imageUrl) return;
    element.src = imageUrl;
}

function formatDate(value) {
    if (!value) return "";
    let dateObj = value.toDate ? value.toDate() : new Date(value);
    if (isNaN(dateObj.getTime())) return String(value);
    return dateObj.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
}

async function loadHomeBakingDesign(){
    if(!newsId) return;

    try{
        const newsRef = doc(db, "news", newsId);
        const newsSnap = await getDoc(newsRef);

        if(!newsSnap.exists()) return;

        const newsData = newsSnap.data();
        const designData = newsData.content || {};

        setImage("heroImage", designData.bakingHeroImage);
        setText("heroTitle", newsData.title || designData.bakingHeroTitle);
        setText("heroDescription", newsData.description || designData.bakingHeroDescription);

        // 작성일 디테일 바인딩
        const entryDate = newsData.date || newsData.createdAt;
        if (entryDate) {
            setText("footerDate", formatDate(entryDate));
        }

        setText("sectionTitle", designData.bakingSectionTitle);
        setText("sectionDescription", designData.bakingSectionDescription);

        setImage("polaroid01Image", designData.bakingPolaroid01Image);
        setText("polaroid01Title", designData.bakingPolaroid01Title);
        setText("polaroid01Description", designData.bakingPolaroid01Description);

        setImage("polaroid02Image", designData.bakingPolaroid02Image);
        setText("polaroid02Title", designData.bakingPolaroid02Title);
        setText("polaroid02Description", designData.bakingPolaroid02Description);

        setImage("polaroid03Image", designData.bakingPolaroid03Image);
        setText("polaroid03Title", designData.bakingPolaroid03Title);
        setText("polaroid03Description", designData.bakingPolaroid03Description);

        setImage("gallery01Image", designData.bakingGallery01Image);
        setImage("gallery02Image", designData.bakingGallery02Image);
        setImage("gallery03Image", designData.bakingGallery03Image);

        setImage("aboutImage", designData.bakingAboutImage);
        setText("aboutEyebrow", designData.bakingAboutEyebrow);
        setText("aboutTitle", designData.bakingAboutTitle);
        setText("aboutDescription", designData.bakingAboutDescription);

        setText("footerNote", designData.bakingFooterNote);
        setText("footerTitle", designData.bakingFooterTitle);
        setText("footerCopyright", designData.bakingFooterCopyright);

        if(newsData.title || designData.bakingHeroTitle){
            document.title = newsData.title || designData.bakingHeroTitle;
        }

    }catch(error){
        console.error("Firebase loading error:", error);
    }
}

loadHomeBakingDesign();

</script>
