<!-- GOOGLE FONTS (Cinzel + Gowun Batang + Plus Jakarta Sans + Caveat) -->
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Cinzel:wght@400;500;600;700&family=Gowun+Batang:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyD_d4etBdBcvBRhTJlD3cLssN309LAdlfg",
    authDomain: "yuri-research-portfolio.firebaseapp.com",
    projectId: "yuri-research-portfolio",
    storageBucket: "yuri-research-portfolio.firebasestorage.app",
    messagingSenderId: "231317507996",
    appId: "1:231317507996:web:9773282c138706d886c259",
    measurementId: "G-57VHW2454"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const params = new URLSearchParams(window.location.search);
const newsId = params.get("id");

function getElement(id) { return document.getElementById(id); }

function setText(id, value) {
    const el = getElement(id);
    if (!el || value === undefined || value === null || value === "") return;
    el.textContent = String(value);
}

function clearText(id) {
    const el = getElement(id);
    if (el) el.textContent = "";
}

function setImage(id, value) {
    const el = getElement(id);
    if (!el || !value) return;
    el.src = String(value).trim();
}

function hideElement(id) {
    const el = getElement(id);
    if (el) el.style.display = "none";
}

function showError(message) {
    const loadingScreen = getElement("loadingScreen");
    const errorScreen = getElement("errorScreen");
    const errorMessage = getElement("errorMessage");
    if (loadingScreen) loadingScreen.style.display = "none";
    if (errorScreen) errorScreen.style.display = "flex";
    if (errorMessage) errorMessage.textContent = message;
}

function formatArchiveDate(value) {
    if (!value) return "";
    let date;
    if (value && typeof value.toDate === "function") {
        date = value.toDate();
    } else if (value instanceof Date) {
        date = value;
    } else {
        date = new Date(value);
    }
    if (Number.isNaN(date.getTime())) return String(value);

    return date.toLocaleDateString("en-US", {
        year: "numeric",
        month: "long",
        day: "numeric"
    });
}

async function loadVintageFlowerDesign() {
    if (!newsId) {
        showError("This archive page requires a news ID.");
        return;
    }

    try {
        const docRef = doc(db, "news", newsId);
        const docSnap = await getDoc(docRef);

        if (!docSnap.exists()) {
            showError("Archive entry not found.");
            return;
        }

        const newsData = docSnap.data();
        const content = (newsData.content && typeof newsData.content === "object") ? newsData.content : {};

        // HERO
        setImage("heroImage", content.vintageHeroImage || newsData.image);
        setText("heroTitle", newsData.title || content.vintageHeroTitle || "Closing a Chapter");
        setText("heroDescription", newsData.description || content.vintageHeroSubtitle || "A small collection of memories.");
        hideElement("heroEyebrow");

        // CIRCLE PHOTO 01 (A Last Walk by Duck Lake 등)
        hideElement("chapter01Label");
        setImage("chapter01Image", content.vintageFlower1Image);
        setText("chapter01Title", content.vintageFlower1Title || "A Last Walk by Duck Lake");
        setText("chapter01Description", content.vintageFlower1Text);

        // WIDE PHOTO + CAPTION (복구 완료)
        setImage("ribbonImage", content.vintageRibbonImage || content.vintageFlower1Image);
        setText("ribbonCaption", content.vintageRibbonTitle || "Congratulations!");

        // CIRCLE PHOTO 02
        hideElement("chapter02Label");
        hideElement("chapter02SideLabel");
        hideElement("chapter02Date");
        setImage("chapter02Image", content.vintageFlower2Image);
        setText("chapter02Title", content.vintageFlower2Title);
        setText("chapter02Description", content.vintageFlower2Text);

        // VIDEO SECTION UNUSED
        hideElement("videoSection");

        // MEMORABLE MOMENTS HEADING
        const quietMomentsHeading = document.querySelector(".section-sage .section-heading .archive-label");
        if (quietMomentsHeading) {
            quietMomentsHeading.textContent = "MEMORABLE MOMENTS";
        }

        // ARCH PHOTO 01
        setImage("page01Image", content.vintageFlower3Image);
        clearText("page01Label");
        setText("page01Title", content.vintageFlower3Title);
        setText("page01Description", content.vintageFlower3Text);

        // ARCH PHOTO 02
        setImage("page02Image", content.vintageGallery1Image);
        clearText("page02Label");
        setText("page02Title", content.vintageGallery1Title);
        setText("page02Description", content.vintageGallery1Text);

        // ARCH PHOTO 03
        setImage("page03Image", content.vintageGallery2Image);
        clearText("page03Label");
        setText("page03Title", content.vintageGallery2Title);
        setText("page03Description", content.vintageGallery2Text);

        // FINAL JOURNAL (Memory A)
        setImage("memoryAImage", content.vintageGallery3Image);
        hideElement("memoryALabel");
        setText("memoryATitle", content.vintageJournalTitle || "Thank You, Graduation Day");
        setText("memoryADescription", content.vintageJournalText);
        hideElement("memoryANote");

        // FINAL PHOTO (Memory B)
        setImage("memoryBImage", content.vintageGallery4Image);
        hideElement("memoryBLabel");
        hideElement("memoryBTitle");
        hideElement("memoryBDescription");
        hideElement("memoryBNote");

        hideElement("memoryCSection");

        // FOOTER DATE BINDING (모달 선택 날짜 매핑)
        const footerDate = getElement("footerDate");
        if (footerDate) {
            const category = newsData.category || "Life";
            const designName = "Vintage Flower";
            const dateStr = formatArchiveDate(newsData.date || newsData.createdAt || newsData.updatedAt);
            
            footerDate.textContent = [dateStr, category, designName].filter(Boolean).join(" · ");
        }

        // DOCUMENT TITLE
        const pageTitle = newsData.title || content.vintageHeroTitle;
        if (pageTitle) {
            document.title = String(pageTitle) + " — Yuri Choi";
        }

        hideElement("loadingScreen");

    } catch (error) {
        console.error("Failed to load VintageFlowerDesign:", error);
        showError("Unable to load this archive. Please try again.");
    }
}

loadVintageFlowerDesign();
</script>
