<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Story — Sofia & Mark</title>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="
https://fonts.googleapis.com/css2?
family=Cormorant+Garamond:wght@400;500;600;700
&family=DM+Serif+Display:ital@0;1
&family=Great+Vibes
&family=Inter:wght@300;400;500;600
&display=swap"
rel="stylesheet">

<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#8fa7b3;
    color:#31526f;
    font-family:'Cormorant Garamond', serif;
    overflow-x:hidden;
}


/* =====================================================
   OCEAN BACKGROUND
===================================================== */

.ocean-background{

    position:fixed;

    inset:0;

    z-index:-10;

    background-image:

    linear-gradient(
        rgba(94,123,139,.25),
        rgba(50,80,96,.15)
    ),

    url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e?
    auto=format&fit=crop&w=2400&q=85");

    background-size:cover;

    background-position:center;

    filter:saturate(.75);

}


/* =====================================================
   OCEAN MOVEMENT
===================================================== */

.ocean-background::after{

    content:"";

    position:absolute;

    inset:0;

    background:

    linear-gradient(
        to bottom,
        rgba(255,255,255,.08),
        transparent 35%,
        rgba(255,255,255,.15)
    );

}


/* =====================================================
   NAV
===================================================== */

.menu-button{

    position:fixed;

    top:28px;

    right:35px;

    z-index:100;

    width:48px;

    height:48px;

    border-radius:50%;

    background:rgba(255,255,255,.65);

    backdrop-filter:blur(8px);

    display:flex;

    align-items:center;

    justify-content:center;

    cursor:pointer;

    box-shadow:
    0 5px 20px rgba(0,0,0,.12);

}

.menu-icon{

    width:20px;

}

.menu-icon span{

    display:block;

    height:1.5px;

    background:#304c60;

    margin:5px 0;

}


/* =====================================================
   MAIN PAPER
===================================================== */

.paper{

    width:min(900px, calc(100vw - 90px));

    margin:80px auto 0;

    background:#f7f1e7;

    position:relative;

    box-shadow:

    0 20px 60px rgba(20,40,50,.28),

    0 3px 12px rgba(0,0,0,.12);

}


/* =====================================================
   PAPER TEXTURE
===================================================== */

.paper::before{

    content:"";

    position:absolute;

    inset:0;

    pointer-events:none;

    opacity:.28;

    background-image:

    url("https://www.transparenttextures.com/patterns/paper-fibers.png");

    mix-blend-mode:multiply;

}


/* =====================================================
   TORN PAPER TOP
===================================================== */

.paper-top{

    position:absolute;

    top:-20px;

    left:0;

    width:100%;

    height:35px;

    background:#f7f1e7;

    clip-path:polygon(

        0 45%,
        4% 30%,
        8% 47%,
        12% 35%,
        16% 48%,
        20% 30%,
        24% 45%,
        28% 33%,
        33% 48%,
        38% 35%,
        43% 50%,
        48% 32%,
        53% 47%,
        58% 33%,
        63% 50%,
        68% 34%,
        73% 48%,
        78% 32%,
        83% 46%,
        88% 34%,
        93% 49%,
        100% 38%,
        100% 100%,
        0 100%

    );

}


/* =====================================================
   HERO
===================================================== */

.hero{

    padding:

    80px 90px

    100px;

    text-align:center;

    position:relative;

}


/* =====================================================
   STAMP
===================================================== */

.stamp{

    position:absolute;

    top:65px;

    right:75px;

    width:100px;

    height:100px;

    border:1px solid rgba(73,101,118,.35);

    border-radius:50%;

    transform:rotate(10deg);

    display:flex;

    align-items:center;

    justify-content:center;

    font-family:'Inter',sans-serif;

    font-size:9px;

    letter-spacing:3px;

    color:rgba(73,101,118,.55);

}

.stamp::before{

    content:"TOGETHER";

    position:absolute;

    top:17px;

}

.stamp::after{

    content:"TRAVEL";

    position:absolute;

    bottom:17px;

}


/* =====================================================
   TITLE
===================================================== */

.hero-title{

    font-family:'Great Vibes', cursive;

    font-size:clamp(80px, 11vw, 145px);

    font-weight:400;

    line-height:.72;

    color:#426d98;

    transform:rotate(-4deg);

    margin-bottom:70px;

}

.hero-title span{

    display:block;

}

.hero-title .and{

    font-family:'Cormorant Garamond',serif;

    font-size:35px;

    transform:rotate(4deg);

    margin:20px 0;

}


/* =====================================================
   PHOTO AREA
===================================================== */

.photo-area{

    position:relative;

    max-width:680px;

    margin:auto;

}


/* =====================================================
   PHOTO
===================================================== */

.photo-frame{

    position:relative;

    padding:14px;

    background:#faf7f0;

    box-shadow:

    0 12px 25px rgba(0,0,0,.18);

    transform:rotate(-1deg);

}

.photo-frame img{

    width:100%;

    display:block;

    aspect-ratio:4 / 3;

    object-fit:cover;

}


/* =====================================================
   PAPER CLIP
===================================================== */

.paperclip{

    position:absolute;

    width:30px;

    height:95px;

    border:3px solid #777;

    border-left-color:transparent;

    border-radius:20px;

    right:20px;

    top:-35px;

    transform:rotate(13deg);

    z-index:5;

    opacity:.75;

}


/* =====================================================
   POSTMARK LINES
===================================================== */

.post-lines{

    position:absolute;

    right:-45px;

    top:48%;

    width:120px;

}

.post-lines span{

    display:block;

    height:1px;

    background:#6e8ca1;

    margin:9px 0;

    transform:rotate(-5deg);

    opacity:.6;

}


/* =====================================================
   SHELL
===================================================== */

.shell{

    position:absolute;

    left:-45px;

    bottom:-45px;

    width:125px;

    height:105px;

    background:

    radial-gradient(
        ellipse at center,
        #f8f3e8 0%,
        #ded5c5 100%
    );

    border-radius:

    80% 20% 70% 30%;

    transform:rotate(-15deg);

    box-shadow:

    0 10px 20px rgba(0,0,0,.2);

    z-index:10;

}

.shell::before{

    content:"";

    position:absolute;

    inset:10px;

    background:

    repeating-linear-gradient(

        90deg,

        transparent 0 8px,

        rgba(130,110,85,.25) 9px 10px

    );

    border-radius:inherit;

}


/* =====================================================
   DATE NOTE
===================================================== */

.date-note{

    position:absolute;

    right:20px;

    bottom:-90px;

    width:270px;

    padding:30px 25px;

    background:#f5f0e6;

    box-shadow:

    0 10px 25px rgba(0,0,0,.18);

    transform:rotate(2deg);

    z-index:15;

}

.date-note h3{

    font-family:'Inter',sans-serif;

    font-size:15px;

    letter-spacing:3px;

    font-weight:500;

    margin-bottom:10px;

}

.date-note p{

    font-family:'Inter',sans-serif;

    font-size:13px;

    letter-spacing:2px;

}

.heart{

    margin-top:15px;

    font-size:20px;

}


/* =====================================================
   INTRO
===================================================== */

.intro{

    padding:

    160px 100px

    100px;

    text-align:center;

}

.intro h2{

    font-family:'DM Serif Display',serif;

    font-size:42px;

    font-weight:400;

    margin-bottom:20px;

}

.intro p{

    max-width:480px;

    margin:auto;

    font-family:'Inter',sans-serif;

    font-size:14px;

    line-height:2;

    color:#57718a;

}

.script{

    font-family:'Great Vibes',cursive;

    font-size:45px;

    margin-top:30px;

    color:#426d98;

}


/* =====================================================
   STARFISH
===================================================== */

.starfish{

    position:absolute;

    right:80px;

    bottom:70px;

    font-size:65px;

    color:#6c8da8;

    transform:rotate(-15deg);

    opacity:.75;

}


/* =====================================================
   TORN BLUE SECTION
===================================================== */

.blue-section{

    position:relative;

    background:#b9cbd4;

    padding:

    90px 70px

    120px;

    text-align:center;

    color:#365d7d;

}


/* =====================================================
   TORN TOP
===================================================== */

.blue-section::before{

    content:"";

    position:absolute;

    top:-30px;

    left:0;

    width:100%;

    height:50px;

    background:#b9cbd4;

    clip-path:polygon(

        0 55%,
        5% 35%,
        10% 52%,
        15% 30%,
        20% 48%,
        25% 34%,
        30% 55%,
        35% 35%,
        40% 48%,
        45% 30%,
        50% 50%,
        55% 33%,
        60% 52%,
        65% 35%,
        70% 48%,
        75% 30%,
        80% 50%,
        85% 35%,
        90% 52%,
        95% 34%,
        100% 50%,
        100% 100%,
        0 100%

    );

}


/* =====================================================
   THE DAY
===================================================== */

.blue-section h2{

    font-family:'DM Serif Display',serif;

    font-style:italic;

    font-size:70px;

    font-weight:400;

}

.date{

    font-family:'Inter',sans-serif;

    letter-spacing:8px;

    margin-top:15px;

}


/* =====================================================
   COUNTDOWN
===================================================== */

.countdown{

    display:flex;

    justify-content:center;

    max-width:650px;

    margin:60px auto 0;

}

.count{

    flex:1;

    border-right:1px dotted rgba(50,80,100,.5);

}

.count:last-child{

    border:none;

}

.number{

    display:block;

    font-family:'Cormorant Garamond',serif;

    font-size:55px;

}

.label{

    font-family:'Inter',sans-serif;

    font-size:11px;

    letter-spacing:2px;

}


/* =====================================================
   OCEAN BOTTOM
===================================================== */

.ocean-bottom{

    height:300px;

    background-image:

    linear-gradient(

        rgba(150,180,190,.15),

        rgba(255,255,255,.05)

    ),

    url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e?
    auto=format&fit=crop&w=2000&q=85");

    background-size:cover;

    background-position:center bottom;

    position:relative;

}


/* =====================================================
   SCROLL
===================================================== */

.scroll-button{

    position:absolute;

    bottom:35px;

    left:50%;

    transform:translateX(-50%);

    width:48px;

    height:48px;

    border:1px solid rgba(40,70,90,.7);

    border-radius:50%;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:22px;

}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:700px){

    .paper{

        width:calc(100vw - 35px);

        margin-top:50px;

    }

    .hero{

        padding:

        70px 25px

        80px;

    }

    .hero-title{

        font-size:78px;

        margin-bottom:60px;

    }

    .stamp{

        right:20px;

        top:45px;

        width:70px;

        height:70px;

        font-size:7px;

    }

    .photo-area{

        width:90%;

    }

    .shell{

        left:-25px;

        width:85px;

        height:75px;

    }

    .date-note{

        right:-5px;

        width:200px;

        padding:20px;

    }

    .date-note h3{

        font-size:11px;

    }

    .date-note p{

        font-size:9px;

    }

    .intro{

        padding:

        130px 30px

        80px;

    }

    .intro h2{

        font-size:34px;

    }

    .starfish{

        right:20px;

        bottom:40px;

        font-size:45px;

    }

    .blue-section{

        padding:

        70px 20px

        100px;

    }

    .blue-section h2{

        font-size:52px;

    }

    .countdown{

        gap:5px;

    }

    .number{

        font-size:35px;

    }

    .label{

        font-size:8px;

        letter-spacing:1px;

    }

}


/* =====================================================
   LARGE DESKTOP
===================================================== */

@media(min-width:1400px){

    .paper{

        width:900px;

    }

    .hero{

        padding-left:100px;

        padding-right:100px;

    }

}

</style>
</head>


<body>


<!-- OCEAN BACKGROUND -->

<div class="ocean-background"></div>

</main>


<script>

/* =====================================================
   SIMPLE COUNTDOWN
===================================================== */

const weddingDate = new Date(
    "June 21, 2027 00:00:00"
);

function updateCountdown(){

    const now = new Date();

    const difference =
        weddingDate - now;

    if(difference <= 0){

        return;

    }

    const days =
        Math.floor(
            difference /
            (1000 * 60 * 60 * 24)
        );

    const hours =
        Math.floor(
            (difference /
            (1000 * 60 * 60))
            % 24
        );

    const minutes =
        Math.floor(
            (difference /
            (1000 * 60))
            % 60
        );

    const seconds =
        Math.floor(
            (difference /
            1000)
            % 60
        );


    const numbers =
        document.querySelectorAll(
            ".number"
        );


    numbers[0].textContent =
        String(days).padStart(3,"0");

    numbers[1].textContent =
        String(hours).padStart(2,"0");

    numbers[2].textContent =
        String(minutes).padStart(2,"0");

    numbers[3].textContent =
        String(seconds).padStart(2,"0");

}

updateCountdown();

setInterval(
    updateCountdown,
    1000
);

</script>

</html>
