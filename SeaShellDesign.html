<script>

/* =========================================================
   COUNTDOWN
========================================================= */

/*
   날짜를 원하는 결혼식 날짜로 변경하세요.
*/

const weddingDate =
new Date("June 21, 2027 00:00:00").getTime();


function updateCountdown(){

    const now =
    new Date().getTime();


    const distance =
    weddingDate - now;


    if(distance <= 0){

        document.getElementById("days")
        .textContent = "000";

        document.getElementById("hours")
        .textContent = "00";

        document.getElementById("minutes")
        .textContent = "00";

        document.getElementById("seconds")
        .textContent = "00";

        return;

    }


    const days =
    Math.floor(
        distance /
        (1000 * 60 * 60 * 24)
    );


    const hours =
    Math.floor(
        (distance /
        (1000 * 60 * 60))
        % 24
    );


    const minutes =
    Math.floor(
        (distance /
        (1000 * 60))
        % 60
    );


    const seconds =
    Math.floor(
        (distance / 1000)
        % 60
    );


    document.getElementById("days")
    .textContent =
    String(days).padStart(3,"0");


    document.getElementById("hours")
    .textContent =
    String(hours).padStart(2,"0");


    document.getElementById("minutes")
    .textContent =
    String(minutes).padStart(2,"0");


    document.getElementById("seconds")
    .textContent =
    String(seconds).padStart(2,"0");

}


updateCountdown();


setInterval(
    updateCountdown,
    1000
);

</script>
