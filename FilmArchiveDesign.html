    background: #f5f0df;

.paper::before {

}

.hero-image-wrap img {

    width: 100%;
    height: 100%;

    object-position: center 35%;

.hero-image-wrap:hover img { transform: scale(1.015); }

}

.hero-top-sub {

}

.hero-bottom { text-align: right; }

.hero-bottom-sub {

.row-1 { top: 0; left: 0; gap: 80px; }

}

.moving-heading { text-align: center; margin-bottom: 50px; }
.moving-label {

.film-frame img { display: block; width: 100%; height: 100%; object-fit: cover; background: #556251; }

.film-text { max-width: 320px; }

}
.film-text h3 {

.travel-heading span {

}
.calendar-days span.memory-date { border: 1px solid #8d9a80; border-radius: 50%; }

}
